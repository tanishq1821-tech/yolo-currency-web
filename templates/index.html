<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Currency Detector - YOLOv8</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; padding: 40px 20px; min-height: 100vh; }
        .container { max-width: 900px; width: 100%; background: #1e293b; border-radius: 16px; padding: 32px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { text-align: center; margin-bottom: 8px; color: #38bdf8; font-size: 28px; }
        p.subtitle { text-align: center; color: #94a3b8; margin-bottom: 28px; }
        
        .upload-card { border: 2px dashed #3b82f6; border-radius: 12px; padding: 30px; text-align: center; background: #0f172a; cursor: pointer; transition: 0.2s; }
        .upload-card:hover { border-color: #60a5fa; background: #1e293b; }
        input[type="file"] { display: none; }
        .btn { background: #2563eb; color: #fff; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 16px; transition: 0.2s; }
        .btn:hover { background: #1d4ed8; }
        
        .loading { display: none; text-align: center; margin: 20px 0; color: #38bdf8; font-weight: bold; }

        .results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .result-box { background: #0f172a; padding: 16px; border-radius: 12px; text-align: center; }
        .result-box img { max-width: 100%; border-radius: 8px; margin-top: 10px; }
        
        .detection-list { margin-top: 24px; background: #0f172a; padding: 20px; border-radius: 12px; }
        .detection-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #334155; }
        .detection-item:last-child { border-bottom: none; }
        .badge { background: #10b981; color: #022c22; padding: 4px 12px; border-radius: 12px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>💵 Indian Banknote Object Detector</h1>
        <p class="subtitle">Powered by YOLOv8 Deep Learning Model</p>

        <form id="uploadForm">
            <div class="upload-card" onclick="document.getElementById('imageInput').click()">
                <p id="fileName">📁 Click or Drag & Drop a Banknote Image (JPG/PNG)</p>
                <input type="file" id="imageInput" accept="image/*" onchange="showFileName()">
            </div>
            <div style="text-align: center;">
                <button type="submit" class="btn">Detect Currency</button>
            </div>
        </form>

        <div class="loading" id="loading">⚡ Running YOLO Inference...</div>

        <div id="outputSection" style="display: none;">
            <div class="results-grid">
                <div class="result-box">
                    <h3>Original Image</h3>
                    <img id="origImg" src="" alt="Original Image">
                </div>
                <div class="result-box">
                    <h3>YOLO Detection</h3>
                    <img id="detectImg" src="" alt="Detection Result">
                </div>
            </div>

            <div class="detection-list">
                <h3>Detection Breakdown</h3>
                <div id="detectionItems"></div>
            </div>
        </div>
    </div>

    <script>
        function showFileName() {
            const input = document.getElementById('imageInput');
            if (input.files.length > 0) {
                document.getElementById('fileName').innerText = "Selected: " + input.files[0].name;
            }
        }

        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const input = document.getElementById('imageInput');
            if (input.files.length === 0) {
                alert("Please select an image file first!");
                return;
            }

            const formData = new FormData();
            formData.append('file', input.files[0]);

            document.getElementById('loading').style.display = 'block';
            document.getElementById('outputSection').style.display = 'none';

            try {
                const response = await fetch('/detect', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (response.ok) {
                    document.getElementById('origImg').src = data.original_image;
                    document.getElementById('detectImg').src = data.detected_image;

                    const listContainer = document.getElementById('detectionItems');
                    listContainer.innerHTML = '';

                    if (data.detections.length === 0) {
                        listContainer.innerHTML = '<p style="color:#94a3b8; padding-top:10px;">No currency banknotes detected.</p>';
                    } else {
                        data.detections.forEach(item => {
                            listContainer.innerHTML += `
                                <div class="detection-item">
                                    <span>Denomination: <strong>${item.class}</strong></span>
                                    <span class="badge">${item.confidence}</span>
                                </div>
                            `;
                        });
                    }

                    document.getElementById('outputSection').style.display = 'block';
                } else {
                    alert(data.error || "An error occurred during detection.");
                }
            } catch (err) {
                alert("Failed to connect to backend server.");
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        });
    </script>
</body>
</html>
